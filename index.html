let noteView="notes", logQuery="", nmQuery="", nmFilter="all", nmOpen=null;
try{ noteView=localStorage.getItem("amari.noteView")||"notes"; }catch(e){}
function noteViewBar(){
  return `<div class="span2 nvbar"><div class="mode" role="group" aria-label="Notes view">${[["notes","My notes"],["log","Session log"],["names","Places & People"]].map(([k,l])=>`<button data-nv="${k}" aria-pressed="${noteView===k}">${l}</button>`).join("")}</div></div>`;
}
function wireNoteView(){
  document.querySelectorAll("[data-nv]").forEach(b=>b.onclick=()=>{ noteView=b.dataset.nv; try{ localStorage.setItem("amari.noteView",noteView); }catch(e){} renderNotes(); });
}
const PK={party:"Party",ally:"Ally",foe:"Foe",neutral:"Other",dead:"Dead"};
function renderLog(){
  const focusId=document.activeElement&&document.activeElement.id;
  const q=logQuery.trim(), ql=q.toLowerCase();
  const all=SESSIONS.map((s,i)=>({...s,i})).reverse();
  const list=all.filter(s=>!ql||(s.t+" "+s.x+" "+(ARCS[s.arc]||"")+" "+fmtDateLong(s.date)).toLowerCase().includes(ql));
  let lastArc=null;
  const html=list.map((s,j)=>{
    const head=s.arc!==lastArc?`<div class="arch"><span class="label">${esc(ARCS[s.arc]||s.arc)}</span></div>`:""; lastArc=s.arc;
    const open=ql||(!q&&j===0);
    return `${head}<details class="sess"${open?" open":""}><summary><span class="sdate">${s.date?fmtDateLong(s.date):"Before Amari's sessions"}</span><b>${hl(s.t,q)}</b></summary><p>${hl(s.x,q)}</p></details>`;
  }).join("");
  document.getElementById("pane-notes").innerHTML=noteViewBar()+`
   <div class="card span2">
     <div class="card-h"><h2>Session log</h2><span class="small muted">${SESSIONS.filter(s=>s.date).length} sessions · newest first</span></div>
     <input id="logSearch" type="search" placeholder="Search sessions… (a name, a place, a spell)" value="${esc(logQuery)}">
     ${html||`<p class="muted small" style="margin:0">No session matches.</p>`}
   </div>`;
  wireNoteView();
  const se=document.getElementById("logSearch");
  se.oninput=e=>{ logQuery=e.target.value; renderNotes(); };
  if(focusId==="logSearch"){ se.focus(); se.setSelectionRange(se.value.length,se.value.length); }
}
function fmtDateLong(d){ if(!d) return ""; const [y,m,dd]=d.split("-").map(Number); return new Date(y,m-1,dd).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function renderNames(){
  const focusId=document.activeElement&&document.activeElement.id;
  const q=nmQuery.trim(), ql=q.toLowerCase();
  const pchip=p=>`<span class="pk pk-${p[1]}">${PK[p[1]]}</span>`;
  const pRow=p=>`<div class="prow"><b>${hl(p[0],q)}</b>${pchip(p)}<span class="pd">${hl(p[2],q)}</span></div>`;
  let body="";
  const nPeople=PLACES.reduce((a,p)=>a+p.ppl.length,0);
  if(nmFilter==="people"){
    const all=[]; PLACES.forEach((pl,pi)=>pl.ppl.forEach(p=>all.push({p,pl,pi})));
    all.sort((a,b)=>a.p[0].localeCompare(b.p[0]));
    const f=all.filter(o=>!ql||(o.p[0]+" "+o.p[2]+" "+o.pl.n).toLowerCase().includes(ql));
    body=f.map(o=>`<div class="prow"><b>${hl(o.p[0],q)}</b>${pchip(o.p)}<button class="plink" data-goplace="${o.pi}">📍 ${esc(o.pl.n)}</button><span class="pd">${hl(o.p[2],q)}</span></div>`).join("")
      ||`<p class="muted small" style="margin:0">No one matches.</p>`;
  } else {
    let lastReg=null; const regs=[...new Set(PLACES.map(x=>x.reg))];
    body=PLACES.map((pl,pi)=>({pl,pi})).sort((x,y)=>regs.indexOf(x.pl.reg)-regs.indexOf(y.pl.reg)||x.pi-y.pi).map(({pl,pi})=>{
      const placeHit=!ql||(pl.n+" "+pl.aka+" "+pl.d+" "+pl.reg).toLowerCase().includes(ql);
      const ppl=placeHit?pl.ppl:pl.ppl.filter(p=>(p[0]+" "+p[2]).toLowerCase().includes(ql));
      if(!placeHit&&!ppl.length) return "";
      const head=pl.reg!==lastReg?`<div class="arch"><span class="label">${esc(pl.reg)}</span></div>`:""; lastReg=pl.reg;
      const open=(ql&&ppl.length)||nmOpen===pi;
      return `${head}<details class="place" id="place-${pi}"${open?" open":""}><summary><b>${hl(pl.n,q)}</b>${pl.aka?`<span class="small muted"> · ${hl(pl.aka,q)}</span>`:""}<span class="pcount">${pl.ppl.length?`${pl.ppl.length} ${pl.ppl.length===1?"person":"people"}`:""}</span></summary>
        <p class="small muted pdesc">${hl(pl.d,q)}</p>${ppl.map(pRow).join("")}</details>`;
    }).join("")||`<p class="muted small" style="margin:0">Nothing matches.</p>`;
  }
  document.getElementById("pane-notes").innerHTML=noteViewBar()+`
   <div class="card span2">
     <div class="card-h"><h2>Places &amp; People</h2><span class="small muted">${PLACES.length} places · ${nPeople} names</span></div>
     <div class="row"><input id="nmSearch" type="search" placeholder="Find a name or place…" value="${esc(nmQuery)}" style="flex:1 1 220px;min-width:0">
       <div class="mode" role="group" aria-label="Show">${[["all","By place"],["people","People A–Z"]].map(([k,l])=>`<button data-nmf="${k}" aria-pressed="${nmFilter===k}">${l}</button>`).join("")}</div></div>
     ${body}
   </div>`;
  wireNoteView();
  const se=document.getElementById("nmSearch");
  se.oninput=e=>{ nmQuery=e.target.value; renderNotes(); };
  document.querySelectorAll("[data-nmf]").forEach(b=>b.onclick=()=>{ nmFilter=b.dataset.nmf; nmOpen=null; renderNotes(); });
  document.querySelectorAll("[data-goplace]").forEach(b=>b.onclick=()=>{ nmFilter="all"; nmQuery=""; nmOpen=+b.dataset.goplace; renderNotes(); const el=document.getElementById("place-"+nmOpen); if(el) el.scrollIntoView({block:"start",behavior:"smooth"}); });
  document.querySelectorAll("details.place").forEach(d=>d.addEventListener("toggle",()=>{ const i=+d.id.split("-")[1]; if(d.open) nmOpen=i; else if(nmOpen===i) nmOpen=null; }));
  if(focusId==="nmSearch"){ se.focus(); se.setSelectionRange(se.value.length,se.value.length); }
}
let noteDraft="", noteKind="note", noteQuery="", noteFilter="all", editingNote=null, confirmDel=null;
function fmtDate(iso){ try{ return new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }catch(e){ return iso; } }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hl(text,q){ const t=esc(text); if(!q) return t; const qs=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return t.replace(new RegExp(qs,"gi"),m=>`<mark>${m}</mark>`); }
function renderNotes(){
  if(noteView==="log") return renderLog();
  if(noteView==="names") return renderNames();
  const focusId=document.activeElement&&document.activeElement.id;
  const q=noteQuery.trim().toLowerCase();
  const list=(S.notes||[]).filter(n=>(noteFilter==="all"||n.kind===noteFilter)&&(!q||n.text.toLowerCase().includes(q)||(n.ctx||"").toLowerCase().includes(q)||(KINDS[n.kind]||"").toLowerCase().includes(q)||fmtDate(n.date).toLowerCase().includes(q)));
  const byDate={}; list.forEach(n=>(byDate[n.date]=byDate[n.date]||[]).push(n));
  const dates=Object.keys(byDate).sort().reverse();
  const openTasks=(S.notes||[]).filter(n=>n.kind==="task"&&!n.done).length;
  document.getElementById("pane-notes").innerHTML=noteViewBar()+`
   <div class="card span2">
     <div class="card-h"><h2>New note</h2><span class="small muted">${fmtDate(today())}</span></div>
     <textarea id="noteText" dir="auto" rows="3" placeholder="A name, a place, a clue, something to do next session…">${esc(noteDraft)}</textarea>
     <div class="row"><div class="mode" role="group" aria-label="Note type">${Object.entries(KINDS).map(([k,l])=>`<button data-nk="${k}" aria-pressed="${noteKind===k}">${l}</button>`).join("")}</div>
       <button class="btn pri" id="noteAdd">Save note</button></div>
   </div>
   <div class="card span2">
     <div class="card-h"><h2>Notes</h2><span class="small muted">${(S.notes||[]).length} saved${openTasks?` · ${openTasks} open task${openTasks===1?"":"s"}`:""}</span></div>
     <div class="row"><input id="noteSearch" type="search" dir="auto" placeholder="Search notes…" value="${esc(noteQuery)}" style="flex:1 1 220px;min-width:0">
       <div class="mode" role="group" aria-label="Filter">${[["all","All"],...Object.entries(KINDS)].map(([k,l])=>`<button data-nf="${k}" aria-pressed="${noteFilter===k}">${l}</button>`).join("")}</div></div>
     ${dates.length?dates.map(d=>`<div class="ndate"><span class="label">${fmtDate(d)}</span></div>${byDate[d].map(n=>`
       <div class="note k-${n.kind} ${n.done?"done":""}">
         ${n.kind==="task"?`<input type="checkbox" data-ndone="${n.id}" ${n.done?"checked":""} aria-label="Done">`:`<span class="nk">${KINDS[n.kind]}</span>`}
         ${editingNote===n.id?`<textarea id="noteEdit" dir="auto" rows="3">${esc(n.text)}</textarea>`:`<div class="nt" dir="auto">${n.ctx?`<span class="nctx">🎲 ${esc(n.ctx)}</span>`:""}${hl(n.text,noteQuery.trim())}</div>`}
         <div class="nact">${editingNote===n.id?`<button class="btn sm pri" data-nsave="${n.id}">Save</button><button class="btn sm" data-ncancel="1">Cancel</button>`
           :confirmDel===n.id?`<button class="btn sm bad" data-ndelok="${n.id}">Delete?</button><button class="btn sm" data-ncancel="1">Keep</button>`
           :`<button class="btn sm" data-nedit="${n.id}">Edit</button><button class="btn sm" data-ndel="${n.id}" aria-label="Delete">✕</button>`}</div>
       </div>`).join("")}`).join("")
      :`<p class="muted small" style="margin:0">${(S.notes||[]).length?"No notes match.":"No notes yet. Write the first one above: a name you heard, a place you visited, or what to do next session."}</p>`}
   </div>`;
  wireNoteView();
  const ta=document.getElementById("noteText");
  ta.oninput=e=>{ noteDraft=e.target.value; };
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) addNote(); });
  document.getElementById("noteAdd").onclick=addNote;
  const se=document.getElementById("noteSearch");
  se.oninput=e=>{ noteQuery=e.target.value; renderNotes(); };
  document.querySelectorAll("[data-nk]").forEach(b=>b.onclick=()=>{ noteKind=b.dataset.nk; renderNotes(); });
  document.querySelectorAll("[data-nf]").forEach(b=>b.onclick=()=>{ noteFilter=b.dataset.nf; renderNotes(); });
  document.querySelectorAll("[data-ndone]").forEach(c=>c.onchange=()=>{ const n=S.notes.find(x=>x.id===c.dataset.ndone); n.done=c.checked; persist(); renderNotes(); });
  document.querySelectorAll("[data-nedit]").forEach(b=>b.onclick=()=>{ editingNote=b.dataset.nedit; confirmDel=null; renderNotes(); const t=document.getElementById("noteEdit"); t.focus(); });
  document.querySelectorAll("[data-nsave]").forEach(b=>b.onclick=()=>{ const n=S.notes.find(x=>x.id===b.dataset.nsave); const v=document.getElementById("noteEdit").value.trim(); if(v){ n.text=v; persist(); } editingNote=null; renderNotes(); });
  document.querySelectorAll("[data-ncancel]").forEach(b=>b.onclick=()=>{ editingNote=null; confirmDel=null; renderNotes(); });
  document.querySelectorAll("[data-ndel]").forEach(b=>b.onclick=()=>{ confirmDel=b.dataset.ndel; editingNote=null; renderNotes(); });
  document.querySelectorAll("[data-ndelok]").forEach(b=>b.onclick=()=>{ S.notes=S.notes.filter(x=>x.id!==b.dataset.ndelok); confirmDel=null; persist(); renderNotes(); });
  if(focusId==="noteSearch"){ se.focus(); se.setSelectionRange(se.value.length,se.value.length); }
  if(focusId==="noteText"){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
}
function addNote(){
  const v=noteDraft.trim(); if(!v) return;
  S.notes=S.notes||[]; S.notes.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:v,kind:noteKind,date:today(),done:false,t:Date.now()});
  noteDraft=""; persist(); renderNotes(); toastMsg("Note saved");
}
function renderTraits(){
  const F=[
   ["Bladesong",`Bonus Action, ${S.song.max} uses per Long Rest. AC +INT, Speed +10 ft, INT for weapon attack and damage rolls, +INT to Concentration saves, Advantage on Acrobatics. 1 minute.`],
   ["Song of Defense","When you take damage while Bladesong is active, use your Reaction and expend a spell slot to reduce the damage by five times the slot's level."],
   ["Extra Attack","Attack twice with the Attack action. You can replace one of the attacks with a Wizard cantrip that takes an action, such as Booming Blade."],
   ["Training in War and Song","Proficient with Melee Martial weapons without Two-Handed or Heavy. You can use such a weapon as your spellcasting focus."],
   ["War Caster","Advantage on Constitution saves to maintain Concentration. You can perform Somatic components with weapons in hand. Reactive Spell: when a creature provokes an Opportunity Attack by leaving your reach, you can cast a 1-action spell targeting only it instead."],
   ["Arcane Recovery",`Once per Long Rest, after a Short Rest, recover spell slots with a combined level of ${Math.ceil(C.level/2)} or less (none 6th level or higher).`],
   ["Memorize Spell","After a Short Rest, you can swap one prepared level 1+ Wizard spell for another from your spellbook."],
   ["Ritual Adept","Cast any ritual spell in your spellbook as a ritual without preparing it."],
   ["Scholar","Expertise in Investigation (+13)."],
   ["High Elf","Darkvision 60 ft. Keen Senses (Perception). Fey Ancestry: Advantage on saves against being Charmed, and magic can't put you to sleep. Trance: 4 hours of meditation in place of sleep."],
  ];
  (S.char.feats||[]).forEach(f=>F.push([`${f.n} (feat, level ${f.lvl})`,f.x||"Its effects aren't automated on this sheet."]));
  Object.entries(LEVEL_FEATS).forEach(([l,t])=>{ l=+l; if(l<=C.level && !ASI_LEVELS.includes(l) && !/slot$/.test(t)) F.push([t.split(":")[0],t.split(":").slice(1).join(":").trim()||t]); });
  document.getElementById("pane-traits").innerHTML=`
   <div class="card span2"><div class="card-h"><h2>Level &amp; abilities</h2><div class="row">${(S.char.history||[]).length?`<button class="btn sm" id="luUndo">Undo last level up</button>`:""}<button class="btn pri" id="luBtn" ${C.level>=20?"disabled":""}>Level up to ${Math.min(20,C.level+1)}</button></div></div>
     <div class="statgrid abilgrid">${ABIL.map(a=>`<div class="stat"><span class="label">${a}</span><b class="num">${C.abil[a]}</b><span class="delta">${sgn(mod(C.abil[a]))}</span></div>`).join("")}</div>
     <p class="small muted" style="margin:0">Wizard ${C.level} · Proficiency +${C.prof} · Max HP ${C.maxHp} (fixed HP per level) · Spell DC ${C.spellDC} · Prepared ${PREP_MAX}</p></div>
   <div class="card"><h2>Features</h2>${F.map(([n,t])=>`<div class="feat"><b>${n}</b><p>${t}</p></div>`).join("")}</div>
   <div class="card prose"><h2>Who she is</h2>
     <div class="portrait"><img id="portraitImg" tabindex="0" role="button" title="Tap to enlarge" src="${PORTRAIT}" alt="Full-body portrait of Amari holding her rapier: short pink hair, green eyes, silver-grey wrap vest over a white blouse, laced grey boots"><div>
     <p class="small muted">Woman · 200 years · 160 cm · pink hair (magical), green eyes · Neutral Good</p>
     <p class="small">Slender and lightly built, with pink hair cut just past the jaw, bright green eyes, freckles, and delicate silver jewelry on her long ears. Practical, elegant clothing; nothing about her ever feels unguarded.</p></div></div>
     <h3>Traits</h3><p>Values careful planning but believes it means nothing without decisive action at the right moment. Drawn to those who act boldly. Curious and observant; notices what others miss.</p>
     <h3>Ideals</h3><p>No authority, tradition, or strategy justifies spending lives carelessly. Force only when necessary, with full awareness of its cost. A life's value is measured by how fully it is lived.</p>
     <h3>Bonds</h3><p>Carries a blade forged by her brother Calion (“The Calculator”). Remembers Sabina, who sat beside her when she was breaking, and tries to be that presence for others. Owes her path to Sindor, who trusted her judgment.</p>
     <h3>Flaws</h3><p>Hesitates too long when lives are at stake. Forms attachments knowing they will end, and is never as ready for the loss as she pretends.</p>
   </div>
   <div class="card prose span2"><h2>Background</h2>
     ${STORY.map(([h,ps],i)=>`<details class="spell" ${i===0?"open":""}><summary><span class="sn" style="font-family:var(--f-title);font-size:1.05rem">${esc(h)}</span></summary><div class="body">${ps.map(p=>`<p>${esc(p)}</p>`).join("")}</div></details>`).join("")}
   </div>`;
  document.getElementById("luBtn").onclick=levelUp;
  const u=document.getElementById("luUndo"); if(u) u.onclick=undoLevel;
}

/* portrait lightbox */
function openLightbox(){ const el=document.getElementById("modal"); el.innerHTML=`<div class="lightbox" data-close="1"><img src="${PORTRAIT}" alt="Amari, full portrait" data-close="1"><button class="btn" data-close="1">Close</button></div>`; }
document.addEventListener("click",e=>{ if(e.target.id==="portraitImg") openLightbox(); });
document.addEventListener("keydown",e=>{ if(e.target.id==="portraitImg"&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openLightbox(); } });
/* one-time cleanup of a stale turn tracker left over out of combat; start/end combat reset it */
function resetIdleTurn(){ if(S.round) return; const t=S.turn||{}; if(t.mv||t.dash||t.a||t.ba||t.h){ S.turn={a:false,ba:false,h:false}; persist(); } }
/* tabs */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; try{localStorage.setItem(LSKEY+"-tab",tab);}catch(e){}
  document.querySelectorAll(".pane").forEach(p=>p.hidden = p.id!=="pane-"+tab);
  render(); window.scrollTo({top:0});
});
document.querySelectorAll(".pane").forEach(p=>p.hidden = p.id!=="pane-"+tab);
if(!S.mvFix1){ S.mvFix1=1; resetIdleTurn(); persist(); }
if(!S.diceFix1){ S.diceFix1=1; S.physical=false; persist(); render(); }

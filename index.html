<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Amari Valennoire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: sticky vitals header + tabbed panes (bottom bar on phone, top tabs on desktop); cards in a 2-col grid on wide screens.
   Palette: moonlit silver with slate UI; colour = source, as on Omer's paper flowchart: rose Bladesong, violet Haste, blue Booming Blade, green Green-Flame, cyan Shield. */
:root{
  --bg:#eceef4; --surface:#ffffff; --sunk:#f5f6fa; --ink:#1b2031; --muted:#5b6279; --line:#d4d8e4;
  --accent:#3d4b6e; --accent-ink:#ffffff; --accent-soft:#e3e7f2;
  --song:#c03c6c; --song-soft:#f8e3eb;
  --haste:#7448b8; --bb:#2a63c4; --gfb:#23804a; --shield:#16809e; --ritual:#0f9488;
  --good:#2b7d52; --bad:#b33434; --warn:#a86a12;
  --f-display:"Marcellus SC","Marcellus",Georgia,"Times New Roman",serif;
  --f-title:"Marcellus",Georgia,serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141d; --surface:#1a1f2c; --sunk:#151925; --ink:#e8eaf2; --muted:#9aa1b8; --line:#2c3346;
  --accent:#aebbe0; --accent-ink:#141826; --accent-soft:#262d42;
  --song:#f07ba5; --song-soft:#3a2230;
  --haste:#b995f2; --bb:#7fb0ff; --gfb:#6fd39a; --shield:#5cc8e6; --ritual:#3fd8c6;
  --good:#5cc08a; --bad:#ef7676; --warn:#e2ad5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141d; --surface:#1a1f2c; --sunk:#151925; --ink:#e8eaf2; --muted:#9aa1b8; --line:#2c3346;
  --accent:#aebbe0; --accent-ink:#141826; --accent-soft:#262d42;
  --song:#f07ba5; --song-soft:#3a2230;
  --haste:#b995f2; --bb:#7fb0ff; --gfb:#6fd39a; --shield:#5cc8e6; --ritual:#3fd8c6;
  --good:#5cc08a; --bad:#ef7676; --warn:#e2ad5a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.num{font-variant-numeric:tabular-nums}
h2,h3{font-family:var(--f-title);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.15rem}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;
  border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.idrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.name{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.02em}
.avatar{width:46px;height:46px;border-radius:50%;vertical-align:middle;margin-right:10px;border:2px solid var(--accent);object-fit:cover}
body.bladesong .avatar{border-color:var(--song);box-shadow:0 0 0 3px var(--song-soft)}
.portrait{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:start}
.portrait img{width:100%;border-radius:8px;border:1px solid var(--line);background:#f4f4f6}
@media (max-width:480px){.portrait{grid-template-columns:minmax(0,130px) minmax(0,1fr)}}
.name small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);letter-spacing:0;margin-left:6px}
.sync{font-size:.75rem;color:var(--muted)}
.topright{gap:6px;margin-left:auto}
.vitals{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:stretch}
.vital{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.vital b{display:block;font-size:1.6rem;line-height:1.1}
.vital .label{font-size:.66rem}
.hprow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.hpq{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;background:transparent;font-size:1.1rem;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.hpq.bad{color:var(--bad)} .hpq.good{color:var(--good)}
.vital.hp b{color:var(--good)} .vital.hp.low b{color:var(--warn)} .vital.hp.crit b{color:var(--bad)}
.song-btn{border:1.5px solid var(--song);background:transparent;color:var(--song);border-radius:8px;padding:4px 10px;font-family:var(--f-title);font-size:.95rem;white-space:nowrap}
body.bladesong .song-btn{background:var(--song);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--sunk);white-space:nowrap}
.chip.on{border-color:var(--src,var(--song));color:var(--src,var(--song));background:var(--surface)}
.chip.conc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.used{opacity:.55;text-decoration:line-through}
button.chip{cursor:pointer}

nav.tabs{display:flex;gap:2px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 4px;border-radius:8px;color:var(--muted);font-family:var(--f-title);font-size:.98rem}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{font-size:.88rem;padding:8px 2px}
}

main{max-width:1100px;margin:14px auto 0}
.pane{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.pane{grid-template-columns:1fr 1fr;align-items:start}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
body.bladesong .card.songy{border-color:var(--song);box-shadow:0 0 0 1px var(--song) inset}

.btn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.song{background:var(--song);border-color:var(--song);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.good{color:var(--good);border-color:var(--good);background:transparent}
.btn.sm{padding:4px 9px;font-size:.88rem}
.deathin{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--ink)}
.arcpick{display:grid;gap:6px}
.arcrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
.arcrow.full{opacity:.5}
.arclv{font-weight:700}
.pip.arcp{width:22px;height:22px}
.pip.arcp.pick{background:var(--good);border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
.pip.arcp.pick::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.pip.arcp.no{opacity:.35;cursor:not-allowed}
.arcbudget{display:flex;align-items:center;gap:10px;margin-top:10px}
.arcmeter{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.arcmeter i{display:block;height:100%;background:var(--good);transition:width .15s}
.saverow{margin-top:10px;display:grid;gap:6px}
.savegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.btn.svb{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;min-height:48px;position:relative;line-height:1.1}
.btn.svb span{font-size:.72rem;letter-spacing:.06em;color:var(--muted)}
.btn.svb.svp span{color:var(--accent);font-weight:700}
.btn.svb b{font-size:1.05rem}
.svadv{position:absolute;top:-7px;right:-4px;font-style:normal;font-size:.6rem;font-weight:700;background:var(--haste);color:#fff;border-radius:6px;padding:1px 4px}
.escnote{margin:6px 0 0;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 14%,transparent);border-left:3px solid var(--warn)}
.escnote>b:first-child{color:var(--warn);font-size:1.05em;margin-right:2px}
.escnote+.escnote{margin-top:4px}
.ask-scrim .sheet{position:relative}
.askx{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1rem;cursor:pointer;z-index:1}
.askx:hover{color:var(--bad);border-color:var(--bad)}
.opt .steps{display:block;position:relative;margin:4px 0 2px}
.opt .steps .st{display:flex;align-items:center;gap:8px;line-height:1.35;color:var(--ink);font-size:.86rem}
.opt .steps .st2{color:var(--src,var(--accent));margin-top:6px}
.opt .steps em{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;border:1.5px solid currentColor;background:var(--surface);position:relative;z-index:1}
.opt .steps::before{content:"";position:absolute;left:8.5px;top:15px;height:calc(100% - 26px);border-left:1.5px solid var(--line)}
.opt .stuse{display:block;font-size:.78rem;color:var(--muted)}
.shbox{border:1px solid var(--src);border-left:4px solid var(--src);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.shtitle{font-weight:700;color:var(--src);letter-spacing:.02em}
.shac{display:flex;align-items:baseline;gap:10px}
.shfrom{font-size:2.2rem;color:var(--muted)}
.sharr{font-size:1.6rem;color:var(--muted)}
.shto{font-size:3rem;color:var(--src);line-height:1}
.shbtn{font-size:1.05rem;padding:12px}
.shbtn.shup{background:var(--warn);border-color:var(--warn);color:#fff}
.rcue{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 5px;vertical-align:middle;white-space:nowrap;color:#fff;background:var(--muted)}
.rcue.dis{background:var(--bad)} .rcue.adv{background:var(--good)} .rcue.mix{background:var(--muted)}
.svadv.rcue{position:absolute;top:-7px;right:-4px}
.cdur{font-weight:400;font-size:.78em;opacity:.85}
.focusbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.colz{position:relative}
.colbtn{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;z-index:2;font-size:.85rem;line-height:1}
.colz:not(.collapsed)>.card-h,.colz:not(.collapsed)>.hptop{padding-right:34px}
.colz.resrow:not(.collapsed) .card-h{padding-right:36px}
.colsum{display:none}
.colz.collapsed{padding-top:10px;padding-bottom:10px}
.colz.collapsed>*:not(.colbtn):not(.colsum){display:none!important}
.colz.collapsed>.colsum{display:block;padding-right:36px;cursor:pointer;color:var(--ink)}
.tgtin{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:6px}
.conctgt{font-weight:700;color:var(--accent)}
.sodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:4px}
.sodgrid .sodb{text-align:center;line-height:1.35;padding:8px 6px}
.cbnums{display:flex;gap:22px;justify-content:center;margin:6px 0 2px}.cbnums>div{display:flex;flex-direction:column;align-items:center}
.cbhm{justify-content:center;margin:8px 0}.cbq{margin:10px 0 4px}
.rnote textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:6px}
.rnadd{align-self:flex-start}.rnsaved{color:var(--good)}
.nctx{display:block;font-size:.75rem;color:var(--muted);margin-bottom:2px}
.prelock{opacity:.38;filter:grayscale(.7);pointer-events:none;user-select:none}
.prelocknote{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-weight:600}
.radd{align-self:flex-start;margin-top:6px}.raddl{color:var(--good);margin-top:4px}
.bchip b{font-weight:600}
.cfxrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.cfxrow select{flex:1 1 130px;min-width:0;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}.cfxv{width:64px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.cfxwrap{position:relative}.cfxwrap .condpick{width:100%}.cfxed{position:absolute;top:6px;right:6px}
.sptyh{margin:8px 0 4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.nvbar{display:flex;justify-content:center}.nvbar .mode{width:100%;max-width:520px}.nvbar .mode button{flex:1;padding:8px 6px}
.arch{padding-top:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
details.sess,details.place{border-bottom:1px solid var(--line);padding:8px 0}
details.sess>summary,details.place>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style-position:outside}
.sdate{font-size:.8rem;color:var(--muted);flex:1 1 100%}
details.sess p{margin:6px 0 2px;line-height:1.5}
.pcount{margin-left:auto;font-size:.78rem;color:var(--muted)}
.pdesc{margin:4px 0 6px}
.prow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:6px 0 6px 10px;border-left:2px solid var(--line);margin-left:4px}
.prow .pd{flex:1 1 100%;font-size:.88rem;color:var(--muted)}
.pk{font-size:.7rem;border-radius:999px;padding:0 7px;border:1px solid var(--line);color:var(--muted)}
.pk-party{border-color:var(--accent);color:var(--accent)}.pk-ally{border-color:var(--good);color:var(--good)}.pk-foe{border-color:var(--bad);color:var(--bad)}.pk-dead{opacity:.75;font-style:italic}
.plink{border:0;background:none;padding:0;font:inherit;font-size:.8rem;color:var(--accent);cursor:pointer;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* HP */
.hpbig{display:flex;align-items:baseline;gap:8px;font-family:var(--f-title)}
.hpbig .cur{font-size:2.6rem;line-height:1}
.hpbar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good)}
.hpbar i.low{background:var(--warn)} .hpbar i.crit{background:var(--bad)}
.hpin{width:5.5em;text-align:center}

.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);padding:0}
.pip{position:relative}
.pip.spent{background:transparent;opacity:.85}
.pip.spent::before,.pip.spent::after{content:"";position:absolute;left:50%;top:50%;width:120%;height:3px;border-radius:2px;background:var(--bad);transform:translate(-50%,-50%) rotate(45deg)}
.pip.spent::after{transform:translate(-50%,-50%) rotate(-45deg)}
.pip.song{border-color:var(--song);background:var(--song)} .pip.song.spent{background:transparent}
.pip.sq{border-radius:6px}
.concstrip{padding:10px 14px;border-left:5px solid var(--accent)} .concstrip.off{border-left-color:var(--line);padding:6px 14px} .concstrip .pip{width:20px;height:20px}
details.more>summary{cursor:pointer;font-size:.85rem;color:var(--muted);list-style:none;padding:4px 0} details.more>summary::-webkit-details-marker{display:none} details.more>summary::before{content:"▸ "} details.more[open]>summary::before{content:"▾ "}
.card.quiet{background:transparent;box-shadow:none;border-style:dashed;padding:8px 14px}
.sublabel{margin-top:6px}
.formgrid{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
textarea.sel{resize:vertical;font:inherit}
.sel.inl{width:auto;margin:0;display:inline-block}
.pending{font-size:.85rem;font-weight:700;color:var(--good);border:1px dashed var(--good);border-radius:8px;padding:3px 8px}
.editrow{justify-content:flex-end} .fxline{color:var(--good)}
.abilgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:520px){.abilgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.statmini.memo{border:1px solid var(--line);font:inherit;color:inherit;cursor:pointer} .statmini.memo b{font-size:1rem} .statmini.memo.ready{border-color:var(--good)} .statmini.memo.ready b{color:var(--good)}
.sel{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:8px}
.spsec.flash{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.resrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px 28px}@media(max-width:700px){.resrow{grid-template-columns:1fr}}.rescol{display:flex;flex-direction:column;gap:8px;min-width:0}.rescol.songy{border:0;padding:0;background:none}
.hpcard .hpbig .cur{font-size:2.4rem}.hpcard .hpbig{margin:0}.hpcard{gap:8px}
.cbrk{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0}.cbrk div{display:flex;flex-direction:column;align-items:center}.cbrk b{font-family:var(--f-title);font-weight:400;font-size:2rem;line-height:1.1}.cbrk i{font-style:normal;color:var(--muted);padding-bottom:6px}
.bbfree{margin:0 0 10px}
.pronebox{display:flex;flex-direction:column;gap:6px}
.mvrow{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.mvrow .mvtop{display:flex;align-items:baseline;gap:8px}.mvrow .mvtop b{font-size:1.4rem;line-height:1}
.mvrange{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;touch-action:none;cursor:pointer}
.mvrange::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
.mvrange::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
.mvrange::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ===== SPELLBOOK THEME (design thread, v42.55): dark leather + gold ink. Omer chose: dark only, quiet combat, no icons, pink halo while Bladesong, crimson concentration. Images are vars set in the IMG block below. ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#1a120c; --surface:#2a1d13; --sunk:#21170f; --ink:#efe1c6; --muted:#bba684; --line:#4f3c27;
  --accent:#d9b46a; --accent-ink:#1a120c; --accent-soft:#3b2b18;
  --gold:#d9b46a; --gold-dim:#8c6f3a;
  --song:#f08aa8; --song-soft:#46222f;
  --haste:#c2a3f4; --bb:#8db7ff; --gfb:#80d6a0; --shield:#72cde6; --ritual:#62d9c7;
  --good:#86d197; --bad:#f2836f; --warn:#ecb85c;
  --conc:#d9b46a; /* gold since v42.88 (Omer: red felt too urgent) */
  --f-display:"Cinzel Decorative","Marcellus SC",Georgia,serif;
  --f-title:"Cormorant Garamond","Marcellus",Georgia,serif;
  color-scheme:dark}
html{background:var(--bg)}
body{background:transparent}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:var(--img-leather) center/cover no-repeat,var(--bg)}
/* Bladesong page halo removed v42.72 (Omer: too distracting) */
@media (prefers-reduced-motion:no-preference){body::after{transition:background .4s}}
body::before{background:#140d08}

/* type */
h2,h3{font-family:var(--f-title);font-weight:600;letter-spacing:.01em}
h2{font-size:1.32rem} .lvlhead h3{font-size:1.4rem}
.name{font-family:var(--f-display);font-weight:700;color:var(--gold);letter-spacing:.01em}
.name small{color:var(--muted)}

/* header: tooled leather band with a gold vine strip under it */
header.top{background:rgba(20,13,8,.93);border-bottom:0;position:sticky}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;pointer-events:none;
  background-color:var(--gold-dim);-webkit-mask:var(--img-border) repeat-x center/auto 9px;mask:var(--img-border) repeat-x center/auto 9px}
main{margin-top:20px}
.avwrap{position:relative;display:inline-block;vertical-align:middle;margin-right:10px;flex:none}
.avwrap .avatar{margin:0;border-color:var(--gold-dim);display:block}
.avwrap .av-song{position:absolute;inset:0;opacity:0;transition:opacity .35s}
body.bladesong .avwrap .av-song{opacity:1}
body.bladesong .avwrap .avatar{border-color:var(--song);box-shadow:0 0 0 3px var(--song-soft),0 0 18px rgba(240,120,170,.7)}
.vital{background:rgba(33,23,15,.85);border-color:var(--line)}
.vital.initv.ready{border-color:var(--gold)} .vital.initv.ready .label{color:var(--gold)}
nav.tabs button{font-family:var(--f-title);font-weight:600;font-size:1.05rem}
nav.tabs button[aria-selected="true"]{color:var(--gold);background:var(--accent-soft)}
@media (max-width:759px){nav.tabs{background:rgba(20,13,8,.96);border-top:1px solid var(--gold-dim)}}

/* pages: vellum cards; the combat turn frame stays plain and solid (quiet combat) */
.card,.lvlblock,.sheet,.rpanel{background:var(--surface) var(--img-vellum) center/cover;border-color:var(--line)}
.card.quiet{background:transparent}
.baseframe{background:#22170f;border-color:var(--ink)}
.opt{background:#3a2a1c}
.opt:hover:not(:disabled){background:#4a3626}
.lvlhead{border-bottom:0;padding-bottom:14px;position:relative}
.lvlhead::after,#pane-traits .card>h2::after,#pane-notes .card>h2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background-color:var(--gold-dim);-webkit-mask:var(--img-divider) no-repeat center/contain;mask:var(--img-divider) no-repeat center/contain}
#pane-traits .card>h2,#pane-notes .card>h2{position:relative;padding-bottom:16px}
/* corner tooling on non-combat cards */
#pane-spells .lvlblock,#pane-checks .card,#pane-gear .card,#pane-notes .card,#pane-traits .card{position:relative}
#pane-spells .lvlblock::before,#pane-checks .card::before,#pane-gear .card::before,#pane-notes .card::before,#pane-traits .card::before,
#pane-spells .lvlblock::after,#pane-checks .card::after,#pane-gear .card::after,#pane-notes .card::after,#pane-traits .card::after{
  content:"";position:absolute;top:5px;width:44px;height:47px;pointer-events:none;opacity:.75;
  background-color:var(--gold-dim);-webkit-mask:var(--img-corner) no-repeat 0 0/contain;mask:var(--img-corner) no-repeat 0 0/contain}
#pane-spells .lvlblock::before,#pane-checks .card::before,#pane-gear .card::before,#pane-notes .card::before,#pane-traits .card::before{left:5px}
#pane-spells .lvlblock::after,#pane-checks .card::after,#pane-gear .card::after,#pane-notes .card::after,#pane-traits .card::after{right:5px;transform:scaleX(-1)}
#pane-spells .lvlblock>*,#pane-checks .card>*,#pane-gear .card>*,#pane-notes .card>*,#pane-traits .card>*:not(.colbtn){position:relative;z-index:1}
/* frontispiece opens the Traits "book", and a chapter mark closes it */
#pane-traits::before{content:"";grid-column:1/-1;justify-self:center;width:min(100%,340px);aspect-ratio:600/803;
  background:var(--img-front) center/contain no-repeat;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#pane-traits::after{content:"";grid-column:1/-1;justify-self:center;width:120px;height:70px;
  background-color:var(--gold-dim);-webkit-mask:var(--img-flourish) no-repeat center/contain;mask:var(--img-flourish) no-repeat center/contain}
.portrait img{background:#2a1d13}

/* concentration: impossible to miss */
.concstrip:not(.off){border:2px solid var(--conc);border-left:8px solid var(--conc);
  background:linear-gradient(90deg,rgba(217,180,106,.26),rgba(217,180,106,.08)),var(--surface);
  box-shadow:0 0 0 1px rgba(217,180,106,.35),0 0 22px rgba(217,180,106,.35)}
.concstrip:not(.off) .label{color:var(--conc);font-weight:700;letter-spacing:.12em}
.concstrip:not(.off) b{color:var(--ink)}
.concstrip:not(.off) .conctgt{color:#f0dcae}
.chip.conc{border-color:var(--conc);color:var(--conc);background:rgba(217,180,106,.14);font-weight:700}
@media (prefers-reduced-motion:no-preference){.concstrip:not(.off){animation:none}
  @keyframes concpulse{50%{box-shadow:0 0 0 1px rgba(217,180,106,.5),0 0 30px rgba(217,180,106,.55)}}}

/* small fixes for the dark book */
.pip.spent{opacity:.9}
.btn{background:#2d2016}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--accent-ink)}
.tip{background:#f3e6cb;color:#1a120c}
.toast{background:#f3e6cb;color:#1a120c}
.hm button.on.h,.hm button.on.m{color:#1a120c}
@media (max-width:759px){.name{font-size:.86rem;letter-spacing:0}.name .avwrap{grid-row:1/3;margin:0}.name .avwrap .avatar{width:40px;height:40px}}

function applyChar(){
  if(S.attuned&&"ms2" in S.attuned){ delete S.attuned.ms2; if(S.charges) delete S.charges.ms2; }
  const ch=S.char; const L=ch.level;
  rebuildLists();
  C.level=L; C.abil={...ch.abil};
  INT=mod(C.abil.INT); DEX=mod(C.abil.DEX); CON=mod(C.abil.CON);
  C.prof=2+Math.floor((L-1)/4);
  C.maxHp=(6+CON)+(L-1)*(4+CON)+(ch.hpBonus||0)+itemFx("hp");
  C.baseAC=12+DEX+itemFx("ac"); C.speed=30+itemFx("speed");
  C.slots=Object.fromEntries(SLOT_TABLE[L].map((n,i)=>[i+1,n]));
  SL().forEach(l=>{ if(S.used[l]==null) S.used[l]=0; });
  C.spellAtk=C.prof+INT+itemFx("spell"); C.spellDC=8+C.prof+INT+itemFx("spell");
  C.saveBonus=itemFx("save");
  S.song.max=Math.max(1,INT); PREP_MAX=PREP_TABLE[L];
  const lt=document.getElementById("lvlTxt"); if(lt) lt.textContent=L;
}

const STORY=[["In brief", ["Amari (Amarielle) Valennoire is an elven bladesinger and former intelligence operative, trained for precision, discretion, and lethal efficiency – until her conscience proved stronger than her orders. Once a rising talent in an elite elven covert order, she was dismissed after refusing to execute a target she determined had acted in self-defense. Shaped by loss and drawn to the urgency of short-lived lives, Amari now works as an independent arcane scout and investigator, choosing contracts that align with her ethics rather than authority. Calm, observant, and quietly stubborn, she believes violence should be deliberate and necessary, never convenient – and she refuses to look away when the cost of action is measured in lives."]], ["Background", ["Amari Valennoire was born in Yar-Lathar into an elven family that already carried both success and quiet rebellion in its history.", "Her parents, Elarion and Serenya, now in their mid-fourth century, are affectionate, supportive, and unusually relaxed by elven standards. When they were younger, they had twin sons, Haldir and Calion – brilliant, gifted, and widely expected to become exemplars of elven cultural and civic ideals. For a time, the family lived under the familiar elven pressure to realize potential in ways that were publicly legible and socially valued.", "Haldir Valennoire fulfilled those expectations. Gifted with rare political acuity, he became the youngest consul Yar-Lathar has ever known and later took on the role of ambassador. He understands institutions, knows how to navigate power, and believes that working within existing structures is the most responsible way to shape the world – especially for those who will outlive its immediate consequences.", "His twin, Calion Valennoire, made a quieter, more controversial choice. Rejecting prestige, he devoted himself to the craft of elven weaponmaking – an unusual and socially eyebrow-raising profession for someone of their family’s background, but one he genuinely loves. He absorbed the resulting criticism without apology, grounding himself in the tangible value of his work rather than its public recognition. The blade Amari carries was forged by Calion himself: exquisitely balanced and precisely fitted to her hand.", "Watching Calion’s choice reshape their parents’ values marked a turning point in the household. By the time Amari was born, worth was no longer measured by legacy or acclaim, but by one’s true passions in life. She grew up defended, trusted, and allowed to define herself."]], ["Interpersonal Patterns", ["Those feelings followed Amari into adulthood. She has always been drawn to short-lived people – not out of novelty or condescension, but because of how they inhabit time. Their urgency, emotional intensity, and decisiveness feel alive to her in ways elven restraint often does not.", "Once, when she was only fifty years old, Amari shared a deep connection with a human. When he asked her to settle down, she declined. They separated, and she later watched him build a family without her. The experience left a quieter, more persistent wound than sudden loss. Since then, she refrained from fully committing to relationships with those she knows she will outlive, caught between her difficulty in pulling away from the short-lived and her fear of binding herself to another ending she will have to survive alone.", "One of the few who understood this tension was Sindor, a powerful elven diplomat and Sabina’s husband. He asked Amari to investigate arcane means of altering racial limitations – particularly magic that might extend the lives of half-elves. Amari knows this request is Sindor’s way of reaching for his son, Nate, though she would never name it aloud."]], ["Service Record: La Balcon", ["In school, Amari excelled across disciplines, and by the time she graduated, she was accepted into La Balcon – an elite elven intelligence and combat order. For nearly a decade, she trained as one of its most promising candidates, mastering surveillance, combat, and covert operations with discipline and precision.", "From early on, however, she was marked as difficult. Not because she failed, but because she asked too many of the “wrong” questions. When missions risked collateral harm, she asked whether the cost was proportionate. When short-lived lives were treated as strategically expendable, she asked whether efficiency justified the arithmetic. Her questions were calm, reasoned, and persistent – and therefore disruptive."]], ["Operational Deviation", ["Over the years, a pattern emerged. Amari followed orders until they crossed a line her conscience would not smooth over. The final incident was decisive.", "She was ordered to eliminate a suspect accused of murdering a high-ranking elf. When Amari found the woman, she uncovered a different truth: the victim had pursued her relentlessly, and the killing had been an act of desperate self-defense. To carry out the order would have been simple. Instead, Amari chose to let her go.", "The fallout was severe, though carefully buried. Officially, the suspect escaped due to an operational error, and Amari was quietly demoted. Her instructors argued in her favor. Her record was exceptional. Her skill unquestioned. Still, the conclusion was unavoidable: Amari was capable, disciplined – and unreliable.", "Her life unraveled swiftly afterward. Still grieving her former partner and stripped of the future she had been trained for, Amari found herself alone in the city, unsure where to go next."]], ["Sabina", ["It was then that Sabina found her.", "Sabina was human, recently arrived in the city and not yet married, though already living with Sindor. She saw Amari sitting alone, overwhelmed and crying, and sat beside her without hesitation. “No one should cry alone,” she said simply, pouring chamomile tea. What began as chance became connection. Only later did they discover their distant familial tie.", "For a time, they were simply two women in a city that always knew where it was going, sharing a moment when neither of them did.", "Sabina became an anchor, offering neither judgment nor direction – only presence. When she died shortly after giving birth to Nate, the loss struck with devastating force. Coming on the heels of Amari’s separation and dismissal, it felt as though nearly everything she had built had been taken from her."]], ["Sindor’s Job Proposal", ["In the aftermath of Sabina’s death, Amari was invited to work for Sindor. The offer was not framed as redemption or rescue, but as trust: work that required discretion, skill, and moral judgment, without demanding obedience at the cost of conscience. Amari accepted."]], ["Present Status", ["She remains shaped by what she has lost, but not defined by it. Thoughtful, empathetic, and quietly stubborn, Amari moves through the world with care – aware of the weight of her actions and unwilling to treat any life as easier to spend. In a society that prizes legacy and visible contribution, Amari Valennoire stands as something else entirely: every moment matters."]]];

const tipTxt=id=>(TIPS[id]||"").replace(/\{INT\}/g,INT).replace(/\{DC\}/g,C.spellDC).replace(/\{RD\}/g,rapD());
let tipEl=null, pressT=null;
let tipPin=false, tipHold=false, pinT=null, tipFor=null, tsx=0, tsy=0;
function placeTip(el){ if(!tipEl) return; if(!el||!el.isConnected){ const h=tipEl.offsetHeight, y=parseFloat(tipEl.style.top)||8; if(y+h>innerHeight-8) tipEl.style.top=Math.max(8,innerHeight-h-8)+"px"; return; } const r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2), innerWidth-w-8), y=r.top-h-8; if(y<8) y=r.bottom+8; if(y+h>innerHeight-8) y=Math.max(8,innerHeight-h-8);
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px"; }
function showTip(el){ const t=el.dataset.tip; if(!t) return; hideTip(true); const title=el.querySelector("b")?.textContent||"";
  tipEl=document.createElement("div"); tipEl.className="tip"; tipEl.setAttribute("role","tooltip"); tipEl.innerHTML=`<b>${esc(title)}</b>${esc(t)}`; document.body.appendChild(tipEl); tipFor=el;
  placeTip(el); }
function tipSpell(el){ if(el.dataset.tsp) return el.dataset.tsp; const t=(el.querySelector("b")?.textContent||"").trim(); const m=SPELLS.filter(x=>t===x.n||t.startsWith(x.n+" ")).sort((a,b)=>b.n.length-a.n.length)[0]; return m?m.n:""; }
function pinTip(){ if(!tipEl||!tipFor) return; tipPin=true; tipEl.classList.add("pinned"); tipEl.setAttribute("role","dialog");
  const sn=tipSpell(tipFor); const ft=document.createElement("div"); ft.className="tipft";
  ft.innerHTML=(sn?`<button class="tiplink" type="button">Full description in Spells →</button>`:"<span></span>")+`<button class="tipx" type="button" aria-label="Close">✕</button>`;
  tipEl.appendChild(ft); placeTip(tipFor); try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  ft.querySelector(".tipx").onclick=()=>hideTip(true);
  if(sn) ft.querySelector(".tiplink").onclick=()=>{ hideTip(true); goSpell(sn); }; }
function goSpell(n){ const sp=SPELLS.find(x=>x.n===n); if(sp&&!((spellType==="all"||spTy(sp)===spellType)&&(spellView==="book"||isPrepared(sp)||sp.r))){ spellView="book"; spellType="all"; }
  document.querySelector('#tabs [data-tab="spells"]').click();
  setTimeout(()=>{ const d=[...document.querySelectorAll("#pane-spells details.spell")].find(x=>x.querySelector(".sn")?.textContent===n); if(!d) return; d.open=true; d.scrollIntoView({block:"start"}); window.scrollBy(0,-(document.querySelector("header.top")?.offsetHeight||0)-8); d.classList.add("flash"); setTimeout(()=>d.classList.remove("flash"),1600); },60); }
function hideTip(force){ force=force===true; if(!force&&(tipPin||tipHold)) return; const t=tipEl; tipEl=null; tipPin=false; tipFor=null; if(t&&t.isConnected) t.remove(); }
document.addEventListener("pointerover",e=>{ if(e.pointerType!=="mouse") return; const el=e.target.closest("[data-tip]"); if(el&&el.dataset.tip) showTip(el); });
document.addEventListener("pointerout",e=>{ if(e.pointerType!=="mouse") return; const el=e.target.closest("[data-tip]"); if(el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("focusin",e=>{ if(tipPin||tipHold) return; const el=e.target.closest&&e.target.closest("[data-tip]"); if(el&&el.dataset.tip&&el.matches(":focus-visible")) showTip(el); });
document.addEventListener("focusout",()=>hideTip());

// touch: press and hold to read (stays while held); hold longer to pin it open with a link to the spell
document.addEventListener("touchstart",e=>{ if(e.target.closest(".tip")) return; if(tipPin) hideTip(true);
  const el=e.target.closest("[data-tip]"); if(!el||!el.dataset.tip) return; const t0=e.touches[0]; tsx=t0.clientX; tsy=t0.clientY;
  clearTimeout(pressT); clearTimeout(pinT);
  // also listen on the element itself: if a re-render detaches it mid-press, touchend no longer bubbles to document
  const rel=ev=>tipRelease(ev,ev.type==="touchcancel"); el.addEventListener("touchend",rel,{once:true}); el.addEventListener("touchcancel",rel,{once:true});
  pressT=setTimeout(()=>{ showTip(el); tipHold=true; el.dataset.held="1"; pinT=setTimeout(pinTip,900); },450); },{passive:true});
function tipRelease(e,cancel){ clearTimeout(pressT); clearTimeout(pinT); const el=e.target.closest&&e.target.closest("[data-tip]");
  if(el&&el.dataset.held){ if(!cancel&&e.cancelable) e.preventDefault(); delete el.dataset.held; }
  if(tipHold){ tipHold=false; if(!tipPin) hideTip(true); } }
document.addEventListener("touchend",e=>tipRelease(e,false));
document.addEventListener("touchcancel",e=>tipRelease(e,true));
document.addEventListener("touchmove",e=>{ const t=e.touches[0]; if(t&&Math.hypot(t.clientX-tsx,t.clientY-tsy)<12) return; clearTimeout(pressT); if(tipHold&&!tipPin){ clearTimeout(pinT); } },{passive:true});
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-tip]")) e.preventDefault(); });
addEventListener("scroll",()=>hideTip(),{passive:true});

function rebuildLists(){

}

/* ---- cloud sync through the artifact db (falls back to this device only) ---- */
let db=null, docRef=null, saveTimer=null, inflight=false, dirty=false;
const syncEl = () => document.getElementById("sync");
/* One-time practice purge (Omer, 2026-11-04): fights and rolls recorded before 5 Nov 2026 17:00 (Israel time) were practice.
   On the first render after that moment they are dropped from history, summaries and backups, once only (S.practiceWiped).
   Never add another wipe without Omer's explicit approval. */
const PRACTICE_CUTOFF=Date.parse("2026-11-05T17:00:00+02:00");
function practicePurge(){
  if(S.practiceWiped||Date.now()<PRACTICE_CUTOFF||S.cur||S.round) return;
  S.practiceWiped=Date.now();
  const old=(S.combats||[]).filter(r=>(r.start||0)<PRACTICE_CUTOFF);
  try{ if(db) old.forEach(r=>{ const d=db.doc("combats/"+r.id); if(d&&d.delete) d.delete().catch(()=>{}); }); }catch(e){}
  S.combats=(S.combats||[]).filter(r=>(r.start||0)>=PRACTICE_CUTOFF);
  S.log=(S.log||[]).filter(x=>(x.t||0)>=PRACTICE_CUTOFF);
  S.lessons="";
  persist();
}
function persist(){
  try{ trackChoice(); }catch(e){}
  S._ts = Math.max(Date.now(), (S._ts||0)+1); /* monotonic: a device whose clock runs behind must still win over the state it just loaded */
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
  if(docRef){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); syncEl().textContent="Saving…"; }
}
async function flush(){
  if(!docRef || inflight || !dirty) return;
  inflight=true; dirty=false;
  try{ await docRef.set(JSON.parse(JSON.stringify(S))); syncEl().textContent="Synced across devices"; }
  catch(e){ syncEl().textContent="Saved on this device (sync failed)"; }
  inflight=false;
  if(dirty) flush();
}
(async()=>{
  try{
    if(!window.claude?.use) return;
    db = await window.claude.use("db");
    if(!db) return;
    docRef = db.doc("sheet/amari");
    const t = setTimeout(()=>{ if(syncEl().textContent==="Connecting…") syncEl().textContent="Saved on this device"; },10000);
    syncEl().textContent="Connecting…";
    docRef.onSnapshot(snap=>{
      clearTimeout(t);
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        const d = snap.data();
        if((d._ts||0) > (S._ts||0)){ S = Object.assign(DEFAULT(), JSON.parse(JSON.stringify(d))); try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){} render(); }
        else if((d._ts||0) < (S._ts||0)){ dirty=true; flush(); }
      } else { dirty=true; flush(); }
      if(!snap.metadata.fromCache) syncEl().textContent="Synced across devices";
    }, ()=>{ syncEl().textContent="Saved on this device"; });
  }catch(e){}
})();

function condRoll(label){
  const L=label.toLowerCase(), r={adv:[],dis:[],fail:"",pen:2*exh(),bon:0,bonWhy:""};
  const isAtk=/attack/.test(L), isSave=/save/.test(L), isInit=/initiative/.test(L), isDeath=/death/.test(L), isCheck=!isAtk&&!isSave&&!isDeath;
  if(isAtk){ ["Blinded","Poisoned","Frightened","Prone","Restrained"].forEach(c=>hasC(c)&&r.dis.push(c)); if(hasC("Invisible")) r.adv.push("Invisible"); }
  if(isCheck){ ["Poisoned","Frightened"].forEach(c=>hasC(c)&&r.dis.push(c)); }
  if(isInit){ if(INCAP.some(hasC)) r.dis.push(incap()); if(hasC("Invisible")) r.adv.push("Invisible"); }
  if(isSave && /^(str|dex)/.test(L)){ const f=["Paralyzed","Petrified","Stunned","Unconscious"].find(hasC); if(f) r.fail=f; if(/^dex/.test(L)&&hasC("Restrained")) r.dis.push("Restrained"); }
  if(isSave && /^dex/.test(L) && S.haste) r.adv.push("Haste");
  const bw=[];
  if(isSave && /^dex/.test(L) && coverV()){ r.bon+=coverV(); bw.push(`+${coverV()} ${COVER[S.cover].n}`); }
  if(isSave && hasB("aura")){ r.bon+=4; bw.push(`+4 ${BOOSTS.aura.n}`); }
  if((isSave||isAtk) && hasB("bless")) r.bless=true;
  const sAb=/^concentration/.test(L)?"CON":(/^(str|dex|con|int|wis|cha)/.exec(L)||[])[1];
  cfxOn().forEach(c=>c.eff.forEach(e=>{ const hit=e.w==="atk"?isAtk:e.w==="save"?isSave:e.w==="check"?(isCheck||isInit):/^[A-Z]{3}$/.test(e.w)?(isSave&&sAb&&sAb.toUpperCase()===e.w):false; if(!hit) return;
    if(e.k==="adv") r.adv.push(c.n); else if(e.k==="dis") r.dis.push(c.n);
    else if(e.k==="die") (r.dice=r.dice||[]).push({e:e.v,n:c.n});
    else { const v=(e.k==="pen"?-1:1)*Math.abs(+e.v||0); if(v){ r.bon+=v; bw.push(`${v>0?"+":""}${v} ${c.n}`); } } }));
  r.bonWhy=bw.join(" · ");
  return r;
}

/* ================= DICE ================= */
function rollExpr(expr, crit=false){
  // "2d8+5", "1d8+6+2d8", "1d20+5"
  let total=0; const parts=[];
  expr.replace(/\s/g,"").match(/[+-]?[^+-]+/g).forEach(term=>{
    const sign = term[0]==="-"?-1:1; const t = term.replace(/^[+-]/,"");
    const m = t.match(/^(\d*)d(\d+)$/);
    if(m){ const n=+(m[1]||1); const f=+m[2]; const rs=[];
      for(let i=0;i<n;i++){ rs.push(1+Math.floor(Math.random()*f)); }
      const s=rs.reduce((a,b)=>a+b,0); total+=sign*s; parts.push(`${n}d${f}[${rs.join(",")}]`);
      if(crit){ total+=sign*n*f; parts.push(`${n*f} max (epic 20)`); }
    } else { total+=sign*(+t); parts.push((sign<0?"-":"")+t); }
  });
  return {total, detail:parts.join(" + ").replace(/\+ -/g,"- ")};
}
// d20 with advantage logic. auto = +1 adv / -1 dis from features
function d20(bonus, auto=0, mOverride=null){
  let m = mOverride!==null ? mOverride : auto + (S.mode==="adv"?1:S.mode==="dis"?-1:0);
  const a=1+Math.floor(Math.random()*20), b=1+Math.floor(Math.random()*20);
  let k=a, note="";
  if(m>0){k=Math.max(a,b); note=`adv ${a}/${b}`} else if(m<0){k=Math.min(a,b); note=`dis ${a}/${b}`}
  return {nat:k, total:k+bonus, note, adv:m>0, dis:m<0};
}
/* ===== Undo the last logged action (v43.33, Omer 2026-11-04) =====
   A snapshot of S is taken at the start of every tap (capture phase, before the button's own handler runs).
   When that tap leads to logged entries (ev / logRoll), the snapshot goes on a small undo stack.
   Only the newest action can be undone (repeatable), always behind a confirm with Keep as the default. */
const UNDO_LS=LSKEY+"-undo"; let undoStack=[]; try{ undoStack=JSON.parse(localStorage.getItem(UNDO_LS)||"[]")||[]; }catch(e){ undoStack=[]; }

const saveUndo=()=>{ try{ localStorage.setItem(UNDO_LS,JSON.stringify(undoStack)); }catch(e){ undoStack=undoStack.slice(-3); try{ localStorage.setItem(UNDO_LS,JSON.stringify(undoStack)); }catch(_){} } };
document.addEventListener("click",e=>{ const t=e.target.closest&&e.target.closest("button,.opt,[data-tsp],input[type=checkbox]"); if(!t||undoBusy) return;
  if(t.closest("#ask,#result,.undoctl,.tabs,nav")) return;
  try{ lgSnap=JSON.stringify(S); lgSnapId++; }catch(_){} },true);
function markUndo(label){ if(undoBusy||!lgSnap) return; const top=undoStack[undoStack.length-1];
  if(top&&top.id===lgSnapId&&top.sid===SESSION_ID){ if(top.labels.length<6&&!top.labels.includes(label)) top.labels.push(label); }
  else { undoStack.push({id:lgSnapId,sid:SESSION_ID,snap:lgSnap,labels:[label],t:Date.now()}); if(undoStack.length>6) undoStack.shift(); }
  saveUndo(); }
const SESSION_ID=Math.random().toString(36).slice(2);
function undoCtl(){ const top=undoStack[undoStack.length-1]; if(!top) return "";
  return `<div class="undoctl"><button class="btn sm" id="bUndoLast" type="button">↶ Undo last: ${esc(top.labels[0])}${top.labels.length>1?` (+${top.labels.length-1})`:""}</button></div>`; }
function undoDiff(before){ const out=[], B=before;
  if(B.hp!==S.hp) out.push(`HP ${S.hp} → ${B.hp}`);
  if(JSON.stringify(B.slots)!==JSON.stringify(S.slots)) out.push("spell slots");
  if(JSON.stringify(B.song)!==JSON.stringify(S.song)) out.push("Bladesong");
  if(!!B.haste!==!!S.haste) out.push(B.haste?"Haste back on":"Haste off");
  if(JSON.stringify(B.conc)!==JSON.stringify(S.conc)) out.push(B.conc?`Concentration back on ${B.conc.name}`:"Concentration removed");
  if(JSON.stringify(B.conds||{})!==JSON.stringify(S.conds||{})) out.push("conditions");
  if(JSON.stringify(B.boosts||{})!==JSON.stringify(S.boosts||{})) out.push("ally boosts");
  if(JSON.stringify(B.charges)!==JSON.stringify(S.charges)) out.push("Mind Sharpener charges");
  if(!!B.reaction!==!!S.reaction) out.push(B.reaction?"Reaction used":"Reaction available again");
  if(JSON.stringify(B.turn)!==JSON.stringify(S.turn)) out.push("this turn's actions");
  if((B.shield||false)!==(S.shield||false)) out.push("Shield");
  return out; }
function undoLast(){ const top=undoStack[undoStack.length-1]; if(!top) return; let before; try{ before=JSON.parse(top.snap); }catch(e){ undoStack.pop(); saveUndo(); render(); return; }
  const ch=undoDiff(before); document.getElementById("result").innerHTML="";
  openModal(`<h3>Undo this?</h3><p><b>${top.labels.map(esc).join("<br>")}</b></p>
   <p class="small">It leaves the log${ch.length?`, and this goes back: ${ch.map(esc).join(" · ")}`:""}. Anything you changed after it is undone too.</p>
   <div class="row"><button class="btn pri" data-close="1">Keep</button><button class="btn bad-solid" id="bUndoGo">Undo it</button></div>`);
  document.getElementById("bUndoGo").onclick=()=>{ undoBusy=true;
    const keep={physical:S.physical,physMode:S.physMode,practiceWiped:S.practiceWiped,lessons:S.lessons,combats:S.combats,spellText:S.spellText,customSpells:S.customSpells,customItems:S.customItems,prepared:S.prepared};
    S=Object.assign(DEFAULT(),before); Object.keys(keep).forEach(k=>{ if(keep[k]!==undefined) S[k]=keep[k]; });
    undoStack.pop(); saveUndo(); lgSnap=null; persist(); closeModal(); render(); if(typeof renderChecks==="function"&&tab==="checks") renderChecks();
    document.getElementById("result").innerHTML=""; undoBusy=false; toastMsg(`Undone: ${top.labels[0]}`); };
}

function rollCue(label,auto=0,short=false){ const cr=condRoll(label);

function condHints(){

function applyDamage(amount, opts={}){

  ev({k:"took",n:dmg,hp:Math.max(0,S.hp-Math.max(0,dmg-S.temp)),note:opts.note||""});
  let fromTemp=Math.min(S.temp,dmg); S.temp-=fromTemp; dmg-=fromTemp;
  const wasUp=S.hp>0;
  S.hp=Math.max(0,S.hp-dmg);

  const notes=[]; if(fromTemp) notes.push(`${fromTemp} absorbed by temp HP`);
  if(wasUp && S.hp===0){ S.conds=S.conds||{}; S.conds.Unconscious="down"; S.conds.Prone=true; if(S.conc){ const nh=S.conc.name==="Haste"; S.conc=null; if(nh) nivLost(); } if(S.song.on){S.song.on=false;} persist(); render();

async function spellAttacks(sp,lvl){
  const r=(sp.rolls||[]).find(x=>x.e!=="atk"&&x.type); if(!r) return;
  let e=r.e; if(r.up && lvl>sp.l) e=e.replace(/^(\d+)d(\d+)/,(m,n,f)=>`${+n+(lvl-sp.l)}d${f}`);
  const what=sp.n==="Scorching Ray"?"ray":"attack";
  const run=async n=>{ let prev=null; for(let i=1;i<=n;i++){ if(i>1 && !(await askNext(i,n,prev,what))) break; prev=await attack(n>1?`${sp.n} ${what} ${i}/${n}`:sp.n, C.spellAtk, e, r.type); } };
  if(sp.n==="Steel Wind Strike"){ openModal(`<h3>Steel Wind Strike</h3><p class="small muted">One melee spell attack per creature (up to 5).</p><div class="row">${[1,2,3,4,5].map(n=>`<button class="btn pri" data-swn="${n}">${n}</button>`).join("")}</div>`);
    document.querySelectorAll("[data-swn]").forEach(b=>b.onclick=()=>{ closeModal(); run(+b.dataset.swn); }); return; }
  run(sp.n==="Scorching Ray"?lvl+1:1);
}

function restCleanup(){ // a rest takes at least an hour: the fight is over, 1-minute effects are gone

  on("oHGFB",async()=>{ S.rider="gfb"; spend("h"); const a=await attack("Green-Flame Blade (Haste)",rb0(),rapD()+"+2d8","piercing + fire"); if(a&&a.hit!==false) armRider(); else { S.rider=null; persist(); render(); } });
  on("oHR1",()=>{ spend("h"); attack("Rapier (Haste)",rb,rd,"piercing"); });
  on("oHD",()=>{ openModal(`<h3>Haste action</h3><div class="row"><button class="btn pri" id="hdDash">Dash (+${speed()} ft)</button><button class="btn" id="hdDis">Disengage</button><button class="btn" data-close="1">Cancel</button></div>`);

  const mr=q("mvRange"); if(mr){ mr.oninput=()=>{ const bud=+mr.max, v=+mr.value; S.turn.mv=v; mr.style.setProperty("--p",(bud?Math.round(v/bud*100):100)+"%"); const nb=document.querySelector(".mvtop b"); if(nb) nb.textContent=bud-v; }; mr.onchange=()=>{ persist(); render(); }; }
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const v=b.dataset.mv, t=S.turn, sp=speed(), bud=sp*(1+(t.dash||0)); t.mv=t.mv||0;

    else if(v.startsWith("crawl")) t.mv=Math.min(bud,t.mv+2*(+v.slice(5)));

    persist(); render(); });

function render(){
  hideTip(); try{ practicePurge(); }catch(e){} applyChar(); if(S.mode&&S.mode!=="normal") S.mode="normal";

  renderHeader();
  ({combat:renderCombat,spells:renderSpells,checks:renderChecks,gear:renderGear,notes:renderNotes,traits:renderTraits})[tab]();
}
function hpClass(){ const p=S.hp/C.maxHp; return p<=.25?"crit":p<=.5?"low":""; }

function diceToggle(){ return `<div class="mode dicemode" role="group" aria-label="Who rolls the dice"><button data-dice="app" aria-pressed="${!S.physical}">App rolls</button><button data-dice="me" aria-pressed="${S.physical}">I roll</button></div>`; }

async function askClaude(kind,name,btn,out){

  const prompt=`You are filling a D&D character sheet for a level ${C.level} High Elf Bladesinger Wizard. Use the D&D 2024 (5.5e) rules; if the ${kind} only exists in an older book, use that book's version. The ${kind} is: "${name}".\nReturn ONLY a JSON object with this shape:\n${spec}\nIf you don't recognize it, return {"unknown":true}.`;

function ddbText(t){ const lines=cleanDdb(t); let out="",ul=false;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^((?:At Higher Levels|Using a Higher-Level Spell Slot|Cantrip Upgrade)\.)/,"<b><i>$1</i></b>");
  lines.forEach(l=>{ const li=/^[-•]\s+/.test(l); if(li&&!ul){out+="<ul>";ul=true;} if(!li&&ul){out+="</ul>";ul=false;}
    if(li) out+=`<li>${inl(l.replace(/^[-•]\s+/,""))}</li>`; else if(/^\*\s*-?/.test(l)&&!/^\*\*/.test(l)) out+=`<p class="foot">${esc(l)}</p>`; else out+=`<p>${inl(l)}</p>`; });
  return out+(ul?"</ul>":""); }
function ddbBlock(sp,txt){ const types=[...new Set((sp.rolls||[]).map(r=>r.type).filter(Boolean))].map(x=>x[0].toUpperCase()+x.slice(1));
  const as=sp.save?`${sp.save} Save · DC ${C.spellDC}`:sp.atk?`Spell attack +${C.spellAtk}`:(sp.l===0&&/Blade$/.test(sp.n))?"Melee":"None";
  const f=[["Level",ORD[sp.l]],["Casting time",(/^\d/.test(sp.t)?"":"1 ")+sp.t+(sp.r?" · Ritual":"")],["Range/Area",sp.rg],["Components",sp.comp],["Duration",(sp.c?"Concentration, ":"")+sp.d],["School",SCHOOL[sp.n]||sp.school||"—"],["Attack/Save",as],["Damage/Effect",types.length?types.join(", "):(TYLBL[spTy(sp)]||"—")]];
  return `<div class="ddb"><div class="dgrid">${f.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(String(v))}</div></div>`).join("")}</div><hr class="drule"><div class="dtext">${ddbText(txt)}</div></div>`; }
function renderSpells(){
  if(!S.prepared) S.prepared=DEFAULT_PREP.slice();
  S.prepared=S.prepared.filter(n=>SPELLS.some(x=>x.n===n));
  const prepCount=S.prepared.length;
  const show=sp=>(spellType==="all"||spTy(sp)===spellType)&&(spellView==="book"||isPrepared(sp)||sp.r);
  const spellHtml=sp=>{ const prep=isPrepared(sp), ty=spTy(sp);
    return `<details class="spell ${prep?"":"unprep"}"><summary>
      ${sp.l&&spellView==="book"?`<button class="prepdot ${prep?"on":""}" data-prep="${esc(sp.n)}" aria-pressed="${prep}" title="${prep?"Prepared · tap to unprepare":"In spellbook · tap to prepare"}"></button>`:sp.l?`<span class="prepdot ${prep?"on":""} static" title="${prep?"Prepared":"Ritual from spellbook"} · change in Spellbook"></span>`:`<span class="prepdot on fixed" title="Cantrip: always ready"></span>`}
      <span class="sn ty-${ty}">${esc(sp.n)}</span>${sp.c?'<span class="tag c">C</span>':""}${sp.r?'<span class="tag r">R</span>':""}<span class="tag">${sp.t}</span>${prep||sp.r?`<button class="btn pri sm qcast" data-cast="${esc(sp.n)}">${sp.l&&!prep?"Ritual":"Cast"}</button>`:""}</summary>
     <div class="body">${(S.spellText||{})[sp.n]?"":`<div class="facts"><span>Range ${sp.rg}</span><span>${sp.d}</span><span>${sp.comp}</span>${sp.save?`<span>${sp.save} save DC ${C.spellDC}</span>`:""}${sp.atk?`<span>Spell attack +${C.spellAtk}</span>`:""}</div>`}
     ${(S.spellText||{})[sp.n]?ddbBlock(sp,S.spellText[sp.n]):`<div>${esc(sp.x)}</div><p class="small muted" style="margin:0">Short summary. Tap “Full text” to paste the official wording.</p>`}
     ${!prep&&sp.l?`<p class="small muted" style="margin:0">${sp.r?"Not prepared, but you can cast it as a ritual from your spellbook (+10 minutes).":"Not prepared. Prepare it after a Long Rest, or swap one in with Memorize Spell after a Short Rest."}</p>`:""}
     <div class="row">${(sp.rolls||[]).map(r=>`<button class="btn sm" data-sr="${esc(sp.n)}" data-e="${r.e}">${esc(r.label)}</button>`).join("")}</div>
     <div class="row editrow"><a class="btn sm" href="https://www.dndbeyond.com/spells?filter-search=${encodeURIComponent(sp.n)}" target="_blank" rel="noopener">D&amp;D Beyond ↗</a><button class="btn sm" data-stext="${esc(sp.n)}">Full text</button><button class="btn sm" data-sedit="${esc(sp.n)}">Edit</button><button class="btn sm bad" data-sdel="${esc(sp.n)}">Remove</button></div></div></details>`; };
  const levelBlock=l=>{ const list=SPELLS.filter(x=>x.l===l&&show(x)); const none=!SPELLS.some(x=>x.l===l); if(!list.length&&!(none&&spellType==="all")) return "";
    const left=slotsLeft(l);
    return `<section class="lvlblock">
      <div class="lvlhead"><h3>${l?ORD[l]+" level":"Cantrips"}</h3>
        ${l?`<div class="lvlslots"><div class="pips">${Array.from({length:C.slots[l]},(_,i)=>`<button class="pip slot ${i<left?"":"spent"}" data-sl="${l}" data-i="${i}" aria-label="${ORD[l]} slot ${i+1}"></button>`).join("")}</div></div>`:`<span class="small muted">At will</span>`}</div>
      ${none?`<p class="small muted" style="margin:6px 0 0">No ${ORD[l]}-level spells yet. You can use this slot to cast a lower-level spell at a higher level.</p>`:list.map(spellHtml).join("")}</section>`; };
  document.getElementById("pane-spells").innerHTML=`
   <div class="card span2">
     <div class="spellbar">
       <div class="statmini"><span class="label"><span class="lf">Save DC</span><span class="ls">DC</span></span><b class="num">${C.spellDC}</b></div>
       <div class="statmini"><span class="label"><span class="lf">Spell attack</span><span class="ls">Attack</span></span><b class="num">+${C.spellAtk}</b></div>
       <div class="statmini ${prepCount>PREP_MAX?"over":""}"><span class="label"><span class="lf">Prepared</span><span class="ls">Prep</span></span><b class="num">${prepCount}/${PREP_MAX}</b></div>
       <div class="statmini"><span class="label"><span class="lf">Arcane Recovery</span><span class="ls">Recovery</span></span><b>${S.arcaneUsed?"Used":"Ready"}</b></div>
       <button class="statmini memo ${S.memo?"ready":""}" id="memoBtn" data-tip="Memorize Spell (Wizard 5): when you finish a Short Rest, you can replace one prepared spell of 1st level or higher with another spell from your spellbook. It doesn't add new spells to the book."><span class="label">Memorize Spell</span><b>${S.memo?"Swap ready":"After Short Rest"}</b></button>
     </div>
     <div class="row spfilters"><div class="mode" role="group" aria-label="Which spells">
         <button data-sv="prepared" aria-pressed="${spellView==="prepared"}">Prepared</button><button data-sv="book" aria-pressed="${spellView==="book"}">Spellbook</button></div><button class="btn pri sm" id="addSpell">+ Add a spell</button>${spellView==="book"?`<button class="btn sm" id="prepReset">Restore original prepared list</button>`:""}${S.char.newSpells>0?`<span class="pending">Level up: ${S.char.newSpells} new spell${S.char.newSpells>1?"s":""} to add</span>`:""}</div>
   </div>
   <div class="span2 lvlgrid">${[0,...SL()].map(levelBlock).join("")||'<p class="muted">No spells match this filter.</p>'}</div>
   <div class="card span2 spfoot">
     <div class="row spadd"><div class="mode typefilter" role="group" aria-label="Spell type">${[["all","All types"],...Object.entries(TYPES)].map(([k,v])=>`<button data-st="${k}" aria-pressed="${spellType===k}">${k==="all"?"":`<i class="dot ty-${k}"></i>`}${v}</button>`).join("")}</div><button class="btn sm lgbtn" id="lgBtn" aria-label="Show key">?</button></div>
     <p class="small muted splegend" id="spLegend" style="margin:0">● prepared · ○ in spellbook only (to prepare or unprepare, open Spellbook and tap the dot) · <span class="tag c">C</span> concentration · <span class="tag r">R</span> ritual, castable from the book without preparing.</p>
   </div>`;
  document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=e=>{ e.preventDefault(); const l=+b.dataset.sl,i=+b.dataset.i; const left=slotsLeft(l); S.used[l]=Math.max(0,Math.min(C.slots[l],(S.used[l]||0)+(i<left?1:-1))); persist(); render();});
  document.querySelectorAll("[data-prep]").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const n=b.dataset.prep;
    if(S.prepared.includes(n)) S.prepared=S.prepared.filter(x=>x!==n);
    else { if(S.prepared.length>=PREP_MAX){ toastMsg(`You can prepare ${PREP_MAX} spells. Unprepare one first.`); return; } S.prepared.push(n); }
    persist(); render(); });
  document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{ spellView=b.dataset.sv; renderSpells(); });
  document.getElementById("memoBtn").onclick=memoFlow;
  document.getElementById("addSpell").onclick=()=>spellForm(null);
  document.getElementById("lgBtn").onclick=()=>document.getElementById("spLegend").classList.toggle("open");
  document.querySelectorAll("[data-sedit]").forEach(b=>b.onclick=()=>spellForm(SPELLS.find(x=>x.n===b.dataset.sedit)));
  document.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>removeSpell(b.dataset.sdel));
  document.querySelectorAll("[data-stext]").forEach(b=>b.onclick=()=>{ const n=b.dataset.stext, cur=(S.spellText||{})[n]||"";
    openModal(`<h3>${esc(n)}: full text</h3><p class="small muted">Copy the spell's description from D&amp;D Beyond (or your book) and paste it here. It's saved with your sheet and shown when you open the spell.</p>
      <textarea id="stIn" class="sel" rows="12">${esc(cur)}</textarea>
      <div class="row"><button class="btn pri" id="stGo">Save</button>${cur?`<button class="btn bad" id="stDel">Remove text</button>`:""}<a class="btn" href="https://www.dndbeyond.com/spells?filter-search=${encodeURIComponent(n)}" target="_blank" rel="noopener">Open D&amp;D Beyond ↗</a><button class="btn" data-close="1">Cancel</button></div>`);
    document.getElementById("stGo").onclick=()=>{ const v=document.getElementById("stIn").value.trim(); S.spellText=S.spellText||{}; if(v) S.spellText[n]=v; else delete S.spellText[n]; persist(); closeModal(); render(); };
    const d=document.getElementById("stDel"); if(d) d.onclick=()=>{ delete S.spellText[n]; persist(); closeModal(); render(); }; });
  const pr=document.getElementById("prepReset"); if(pr) pr.onclick=()=>{ if(!confirm("Replace your prepared spells with the original list of 16?")) return; S.prepared=DEFAULT_PREP.slice(); persist(); render(); toastMsg("Prepared spells restored"); };
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ spellType=b.dataset.st; renderSpells(); });
  document.querySelectorAll("[data-cast]").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); castSpell(SPELLS.find(s=>s.n===b.dataset.cast)); });
  document.querySelectorAll("[data-sr]").forEach(b=>b.onclick=async()=>{ const e=b.dataset.e;
    if(e==="atk"){ const r=await rollD20(`${b.dataset.sr} attack`,C.spellAtk); ev({k:"atk",label:b.dataset.sr,toHit:r.total,nat:r.nat,note:r.note||"",dmg:null,hit:r.nat===20?true:r.nat===1?false:null}); noEv=true; pendEvi=S.round&&S.cur?S.cur.ev.length-1:null; logRoll(`${b.dataset.sr} attack`, r.total, `d20 ${r.nat}${r.note?" ("+r.note+")":""} +${C.spellAtk}`, r.nat===20?"nat20":r.nat===1?"nat1":""); }
    else { const d=await rollDmg(b.dataset.sr,e); logRoll(b.dataset.sr,d.total,d.detail); } });
}

function renderChecks(){
  const sk=C.skills.map(([n,a,p])=>{ const bonus=mod(C.abil[a])+(p?C.prof*p:0); let auto=0, why="";
    if(n==="Stealth"){auto=1;why="Boots";} if(n==="Acrobatics"&&S.song.on){auto=1;why="Song";}
    return `<div class="li"><span><span class="prof ${p===2?"e":p?"p":""}"></span>${n} <span class="small muted">${a}</span>${auto?`<span class="adv">ADV · ${why}</span>`:""} ${rollCue(n)}</span><b class="num">${sgn(bonus)}</b><button class="btn sm" data-sk="${n}" data-b="${bonus}" data-a="${auto}">Roll</button></div>`;}).join("");
  const sv=Object.keys(C.abil).map(a=>{ const b=mod(C.abil[a])+(C.saveProf.includes(a)?C.prof:0)+(C.saveBonus||0);
    return `<div class="ab sv ${C.saveProf.includes(a)?"svp":""}"><span class="label"><span class="prof ${C.saveProf.includes(a)?"p":""}"></span>${a}</span><b class="num">${sgn(b)}</b>${rollCue(a+" save",0,true)}<button class="btn" data-sv="${a}" data-b="${b}">Roll</button></div>`;}).join("");
  document.getElementById("pane-checks").innerHTML=`
   <div class="card span2">
     <div class="card-h"><h2>Abilities</h2><div class="row">${diceToggle()}</div></div>
     <div class="abil">${Object.entries(C.abil).map(([a,v])=>`<div class="ab"><span class="label">${a}</span><b class="num">${sgn(mod(v))}</b><span class="sc">${v}</span>${rollCue(a+" check",0,true)}<button class="btn" data-ab="${a}">Check</button></div>`).join("")}</div>
   </div>
   <div class="card"><div class="card-h"><h2>Skills</h2><span class="small muted">● proficient · <span style="color:var(--accent)">●</span> expertise</span></div><div class="list">${sk}</div></div>
   <div class="card"><h2>Saving throws</h2><div class="abil svgrid">${sv}</div>
     ${svMods()}<p class="small muted" style="margin:0">Concentration saves are rolled on the Combat tab.</p>
     <div class="statgrid"><div class="stat"><span class="label">Passive Perc.</span><b class="num">14</b></div><div class="stat"><span class="label" title="Passive Insight">Passive Ins.</span><b class="num">14</b></div><div class="stat"><span class="label" title="Passive Investigation">Passive Inv.</span><b class="num">23</b></div></div>
     <h2>Quick dice</h2>
     <div class="row">${[4,6,8,10,12,20,100].map(f=>`<button class="btn sm" data-qd="${f}">d${f}</button>`).join("")}</div>
     <h2>Recent rolls</h2>${undoCtl()}
     <div class="log">${S.log.length?S.log.map(l=>`<div><span>${esc(l.label)} <span class="muted small">${esc(l.detail)}</span></span><b class="num ${l.cls}">${l.total}</b></div>`).join(""):'<span class="muted small">Rolls you make show up here.</span>'}</div>
   </div>`;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;persist();renderChecks();});
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>rollCheck(b.dataset.sk,+b.dataset.b,+b.dataset.a));
  document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>rollCheck(b.dataset.sv+" save",+b.dataset.b));
  document.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>rollCheck(b.dataset.ab+" check",mod(C.abil[b.dataset.ab])));
  document.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>{const d=rollExpr("1d"+b.dataset.qd);logRoll("d"+b.dataset.qd,d.total,d.detail);});
}

function renderGear(){
  const n=attunedCount();
  document.getElementById("pane-gear").innerHTML=`
   <div class="card span2">
     <div class="card-h"><h2>Magic items</h2><div class="row"><span class="small ${n>3?"no":"muted"}">Attuned ${n}/3</span><button class="btn pri sm" id="addItem">+ Add item</button></div></div>
     ${ITEMS.map(it=>`<div class="item"><div class="ih"><span class="in">${esc(it.n)}</span>
       ${it.att?`<button class="attbtn ${S.attuned[it.id]?"on":""}" data-att="${it.id}" aria-pressed="${!!S.attuned[it.id]}">${S.attuned[it.id]?"◆ Attuned":"◇ Attune"}</button>`:`<span class="small muted">No attunement needed</span>`}</div>
       <div class="small">${esc(it.x)}</div>
       ${(it.fx||[]).length?`<div class="small fxline">${it.fx.map(f=>`${sgn(f.v)} ${FX[f.k]}`).join(" · ")}${it.att&&!S.attuned[it.id]?" (when attuned)":""}</div>`:""}
       ${it.charges?`<div class="row"><span class="label">Charges</span><div class="pips">${Array.from({length:it.charges},(_,i)=>i).map(i=>`<button class="pip sq ${i<(S.charges[it.id]??it.charges)?"":"spent"}" data-ch="${it.id}" data-i="${i}" aria-label="charge ${i+1}"></button>`).join("")}</div>${it.custom?`<span class="small muted">${it.rw&&it.rw!=="none"?`Regains ${esc(it.ra||"all")} on ${it.rw==="short"?"a Short or Long Rest":it.rw==="dawn"?"dawn (Long Rest)":"a Long Rest"}`:""}</span>`:`<button class="btn sm" data-dawn="${it.id}">Dawn: +1d4</button>`}</div>`:""}
       <div class="row editrow"><button class="btn sm" data-iedit="${it.id}">Edit</button><button class="btn sm bad" data-idel="${it.id}">Remove</button></div>
     </div>`).join("")}
   </div>
   <div class="card"><h2>Coins</h2><div class="coins">${Object.keys(S.coins).map(c=>`<label for="coin-${c}">${c}<input id="coin-${c}" class="num" type="number" inputmode="numeric" value="${S.coins[c]}" data-coin="${c}"></label>`).join("")}</div>
     <div class="row coinops"><label class="label" for="coinAmt">Amount</label><input id="coinAmt" class="hpin num" type="number" inputmode="numeric" min="1" placeholder="0">
       <select id="coinCur" aria-label="Coin type">${Object.keys(S.coins).map(c=>`<option ${c==="GP"?"selected":""}>${c}</option>`).join("")}</select>
       <span class="coinbtns"><button class="btn good" id="coinAdd">+ Add</button><button class="btn bad" id="coinSub">− Spend</button></span></div>
     <p class="small muted" style="margin:0">Carrying 47 lb · encumbered at 120 lb.</p></div>
   <div class="card"><h2>Pack</h2><ul class="mundane">${MUNDANE.map(m=>`<li>${m}</li>`).join("")}</ul>
     <p class="small muted" style="margin:0">Proficient with Disguise Kit. Languages: Common, Dwarvish, Elvish, Sylvan.</p></div>
   <div class="card span2"><div class="card-h"><h2>Attunement</h2><span class="small muted num">${n}/3 used · ${Math.max(0,3-n)} free</span></div>
     <div class="attslots">${[0,1,2].map(i=>{ const it=ITEMS.filter(x=>x.att&&S.attuned[x.id])[i];
       return it?`<div class="attslot full"><span class="label">Slot ${i+1}</span><b>${esc(it.n)}</b><button class="btn sm" data-unatt="${it.id}">End attunement</button></div>`
                :`<div class="attslot"><span class="label">Slot ${i+1}</span><b class="muted">Empty</b><span class="small muted">Attune during a Short Rest</span></div>`; }).join("")}</div></div>`;
  document.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{ const k=b.dataset.att;
    if(!S.attuned[k] && attunedCount()>=3){ toastMsg("All 3 attunement slots are full. End one first."); return; }
    S.attuned[k]=!S.attuned[k]; persist(); render(); });
  document.querySelectorAll("[data-unatt]").forEach(b=>b.onclick=()=>{ S.attuned[b.dataset.unatt]=false; persist(); render(); });
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const k=b.dataset.ch,i=+b.dataset.i, mx=(ITEMS.find(x=>x.id===k)||{charges:4}).charges; S.charges[k]=Math.max(0,Math.min(mx,(S.charges[k]??mx)+(i<(S.charges[k]??mx)?-1:1))); persist(); render();});
  document.getElementById("addItem").onclick=()=>itemForm(null);
  document.querySelectorAll("[data-iedit]").forEach(b=>b.onclick=()=>itemForm(ITEMS.find(x=>x.id===b.dataset.iedit)));
  document.querySelectorAll("[data-idel]").forEach(b=>b.onclick=()=>removeItem(b.dataset.idel));
  document.querySelectorAll("[data-dawn]").forEach(b=>b.onclick=async()=>{const k=b.dataset.dawn; const r=await rollDmg("Mind Sharpener recharge","1d4"); S.charges[k]=Math.min(4,S.charges[k]+r.total); persist(); render(); logRoll("Mind Sharpener recharge",r.total,r.detail);});
  const coinOp=sign=>{ const v=parseInt(document.getElementById("coinAmt").value,10); const c=document.getElementById("coinCur").value; if(!(v>0)) return;
    if(sign<0 && S.coins[c]<v){ toastMsg(`Only ${S.coins[c]} ${c} on hand`); return; }
    S.coins[c]+=sign*v; persist(); render(); toastMsg(`${sign>0?"+":"−"}${v} ${c} → ${S.coins[c]} ${c}`); };
  document.getElementById("coinAdd").onclick=()=>coinOp(1); document.getElementById("coinSub").onclick=()=>coinOp(-1);
  document.getElementById("coinAmt").addEventListener("keydown",e=>{ if(e.key==="Enter") coinOp(1); });
  document.querySelectorAll("[data-coin]").forEach(b=>b.onchange=e=>{S.coins[b.dataset.coin]=+e.target.value||0;persist();});
}

  x:"Amari takes Mangif to her brother Cal, a perfectionist smith; Mangif buys Serpent Scale Mail for 900 gp and Warren buys Cal's scraps for 2,000. Elmond donates 700 gp to the association for short-lived creatures and heals its clinic. At the magic library Amari buys Mangif a Gem of Seeing and Gloves of Thieving. Mangif invites Amari aboard with her own cabin. At night on Nate's childhood hill everyone sees their own deaths, leaves their bodies, and steps through a door into a cabin where a beholder greets Nate: \"My, how you have grown.\""},
 {arc:"Feywild",date:"2026-04-13",t:"Oliver, the coffee man, Marvin, the inn",
  x:"Nate is taken over and leaves as a grinning double. The beholder Oliver plays host (stale cookies, wine, Buddy teaches him \"Cheers\") and asks for healer supplies and sweets. An old man's coffee takes memories: Warren gives away Tiamat's prison, Niviro a childhood memory, Mangif his mother's fate. A hurt sprite warns of werewolves: if the forest goes silent, run. Marvin the healer charms half the party and Warren carves him a naked statue. In an old inn, Warren dispels a looping patron who shouts \"Run!\""},
 {arc:"Feywild",date:"2026-04-30",t:"Trapped in Gildred's inn",

 {arc:"Feywild",date:"2026-05-14",t:"Breaking the inn's dream",

 {arc:"Feywild",date:"2026-05-27",t:"Aisling and Lanamelk's warning",
  x:"The party follows the Kalashtar, dream people who fear dreaming, to the sand city of Aisling, where a guard says the party isn't physically there. Lanamelk explains the seven Sandmen: Naros trapped people in endless dreams and is held by sacrificing a dreamer, now younger and more often; he almost escaped 14 years ago, when Nate's powers woke. Lanamelk's son Golmek was sacrificed five years ago, and he gives Amari his locket. Nite leads them to a crater of child skeletons."},
 {arc:"Feywild",date:"2026-06-11",t:"Meeting Naros",

 {arc:"Feywild",date:"2026-07-08",t:"Out of the dream, back in Yal Lathar",

 {arc:"Rescue",date:"2026-08-06",t:"Amari's secret and Belmont",

 {arc:"Rescue",date:"2026-08-12",t:"The resurrection ritual",

 {arc:"Rescue",date:"2026-09-10",t:"Flight to Lara Maya",

 {arc:"Rescue",date:"2026-09-24",t:"The flooded halls and the Kuo-toa",

 {arc:"Rescue",date:"2026-10-12",t:"The shapeshifter and the cogwheel door",
